<section>
    <h2>Ingreso de Empleados</h2>
</section>

<div class="contenedor">

    <form>

        <input 
            type="text" 
            name="cedula"
            placeholder="Cédula (sin puntos ni guiones)"
            required
            pattern="[0-9]{7,8}"
            inputmode="numeric"
        >

        <input 
            type="password" 
            name="password"
            placeholder="Contraseña (mínimo 6 caracteres)"
            required
            minlength="6"
        >

        <button type="submit">Ingresar</button>

    </form>

</div>
